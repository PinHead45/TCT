<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Cooldown Tracker</title>
    
    <!-- PWA Update Optimization: Tell the browser NOT to cache the page aggressively -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tone.js (for sound notification only) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlRhY3RpY2FsIENvb2xkb3ducyIsCiAgInNob3J0X25hbWUiOiAiQ2hvcHBlclRpbWVyIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kb2xvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMxMTE4MjciLAogICJ0aGVtZV9jb2xvciI6IiMxMTE4MjciLAogICJpY29ucyI6IFsgeyAic3JjIjogImh0dHBzOi8vcGxhY2Vob2xkLmNvLzE5MngxOTIvMGQxMTE3L2U1M2UzZS9wbmc/dGV4dD1UQ1QiLCAic2l6ZXMiOiAiMTkyeDE5MiIsICJ0eXBlIjogImltYWdlL3BuZyIgfSBdCn0=" />

    <style>
        /* Prevent pull-to-refresh on mobile to feel more like an app */
        body {
            overscroll-behavior-y: contain;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen overflow-y-auto">

    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useReducer } = React;
        
        // --- CONFIGURATION ---
        // UPDATED: Bumped version to 2.1 for button text change
        const CURRENT_APP_VERSION = '2.1'; 
        const LOCAL_STORAGE_VERSION_KEY = 'appVersion';
        const SERVICE_WORKER_UPDATE_KEY = 'swUpdatePending';


        /**
         * Component: ProgressBar
         */
        const ProgressBar = ({ timeLeft, initialSeconds, primaryColor, isStarted }) => {
            const percentage = (timeLeft / initialSeconds) * 100;

            let barColor = primaryColor;
            
            if (percentage <= 15 && isStarted) {
                barColor = 'bg-red-700 animate-pulse'; 
            } else if (percentage <= 40 && isStarted) {
                barColor = 'bg-yellow-500';
            } else if (!isStarted) {
                barColor = 'bg-gray-600';
            }

            return (
                <div className="w-full h-10 bg-gray-900 border-2 border-dashed border-gray-600 rounded-lg overflow-hidden relative shadow-inner">
                    <div 
                        className={`h-full ${barColor} transition-all duration-100 ease-linear flex items-center justify-center`}
                        style={{ width: `${percentage}%` }}
                    >
                    </div>
                </div>
            );
        };

        // --- Custom Hook: useTimer ---
        const useTimer = (initialSeconds, synth, onCompletion, stopGlobalTimer) => {
            const [timeLeft, setTimeLeft] = useState(initialSeconds);
            const [isStarted, setIsStarted] = useState(false);
            const [soundPlayed, setSoundPlayed] = useState(false); // Tracks if the 5s warning has played
            const intervalRef = useRef(null);

            const playWarningSound = useCallback(() => {
                if (synth && typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                    Tone.start();
                }
                // Plays a quick warning tone (C4)
                synth?.triggerAttackRelease('C4', '8n'); 
                setSoundPlayed(true);
            }, [synth]);

            const handleLoopReset = useCallback(() => {
                setTimeLeft(initialSeconds); 
                setSoundPlayed(false); // Reset sound flag for the next cycle
                onCompletion(); // Notify parent of completion
            }, [initialSeconds, onCompletion]);

            const triggerStartOrRestart = useCallback(() => {
                if (!isStarted) {
                    setIsStarted(true);
                } else {
                    setTimeLeft(initialSeconds);
                }
                setSoundPlayed(false); // Ensure sound flag is reset on manual restart
            }, [isStarted, initialSeconds]);

            const stopTimer = useCallback(() => {
                setIsStarted(false);
                setTimeLeft(initialSeconds); // Reset time when stopping (clears the bar)
                setSoundPlayed(false); // Ensure sound flag is reset on stop
                stopGlobalTimer(); // Notify App to check lock status
            }, [initialSeconds, stopGlobalTimer]);

            useEffect(() => {
                if (isStarted) {
                    if (intervalRef.current) clearInterval(intervalRef.current);
                    
                    intervalRef.current = setInterval(() => {
                        setTimeLeft(prevTime => {
                            if (prevTime > 0) {
                                const newTime = prevTime - 1;
                                
                                // 1. WARNING SOUND CHECK (5 seconds remaining)
                                if (newTime <= 5 && newTime > 0 && !soundPlayed) {
                                    playWarningSound();
                                }
                                
                                // 2. LOOP RESET CHECK (0 seconds remaining)
                                if (newTime === 0) {
                                     handleLoopReset(); 
                                     return initialSeconds; // Reset immediately for the next loop display
                                }

                                return newTime;
                            }
                            return initialSeconds;
                        });
                    }, 1000);
                } else {
                    if (intervalRef.current) {
                        clearInterval(intervalRef.current);
                        intervalRef.current = null;
                    }
                }
                return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
            }, [isStarted, initialSeconds, handleLoopReset, playWarningSound, soundPlayed]);
            
            return { timeLeft, isStarted, triggerStartOrRestart, stopTimer, setIsStarted };
        };


        /**
         * Component: TacticalTimerModule
         */
        const TacticalTimerModule = React.forwardRef(({ name, description, initialSeconds, colorClass, synth, activateLock, stopLock, timerId }, ref) => {
            const handleCompletion = useCallback(() => {
                // Timer automatically loops
            }, []);

            const { timeLeft, isStarted, triggerStartOrRestart, stopTimer } = useTimer(initialSeconds, synth, handleCompletion, stopLock);
            
            // Expose the stop function to the parent component via the ref
            React.useImperativeHandle(ref, () => ({
                stop: stopTimer, // Renamed to 'stop' for simplicity in App component
                isStarted: isStarted,
            }));

            const handleButtonClick = () => {
                triggerStartOrRestart();
                activateLock(timerId); // Request wake lock
            };

            // UPDATED: Button text for when the timer is already running
            const buttonText = isStarted ? 'REINITIATE COOLDOWN CYCLE' : 'INITIATE DEPLOYMENT CYCLE';
            
            const buttonColor = colorClass.replace('bg-', 'bg-');
            const borderColor = colorClass.replace('bg-', 'border-');

            let statusText = isStarted ? `ACTIVE COOLDOWN / ${timeLeft}s REMAINING` : 'STATUS: STANDBY';
            let statusColor = 'text-gray-500';
            
            if (isStarted && timeLeft <= 10) {
                statusText = 'INBOUND! LANDING ZONE CLEARANCE';
                statusColor = colorClass.replace('bg-', 'text-');
                if (colorClass === 'bg-red-500') statusColor = 'text-red-500 animate-pulse';
            } else if (isStarted && timeLeft === initialSeconds) {
                statusText = 'REDEPLOYING CHOPPER...';
                statusColor = 'text-white animate-pulse';
            } else if (isStarted) {
                statusColor = colorClass.replace('bg-', 'text-');
            }

            return (
                <div className="flex flex-col bg-gray-900/90 p-4 sm:p-6 rounded-lg shadow-2xl w-full h-full border-2 border-dashed border-gray-600/50 font-mono">
                    <div className="flex flex-col w-full flex-grow items-center">
                        <h2 className={`text-xl font-bold uppercase tracking-widest mb-2 text-center ${colorClass.replace('bg-', 'text-')}`}>
                            {name}
                        </h2>
                        <p className="text-xs text-gray-400 mb-4 text-center">{description}</p>
                        <p className={`text-[10px] font-semibold mb-4 ${statusColor}`}>{statusText}</p>

                        <div className="mt-auto mb-6 w-full"> 
                            <ProgressBar 
                                timeLeft={timeLeft} 
                                initialSeconds={initialSeconds} 
                                primaryColor={colorClass} 
                                isStarted={isStarted}
                            />
                        </div>
                    </div>

                    <button 
                        onClick={handleButtonClick}
                        className={`w-full p-4 text-sm font-black rounded-lg text-white shadow-xl uppercase tracking-wider transition transform active:scale-[0.98] border-b-4 ${buttonColor} ${borderColor}`}
                        style={{borderColor: colorClass.replace('bg-', '')}}
                    >
                        {buttonText}
                    </button>
                </div>
            );
        });


        // --- Main App Component ---
        const App = () => {
            const [synth, setSynth] = useState(null);
            const wakeLockRef = useRef(null); 
            const [lockStatus, setLockStatus] = useState(false);
            
            // PWA Update State: Check if the *Service Worker* has signalled an update is ready.
            const [isUpdateReady, setIsUpdateReady] = useState(false);
            
            // Refs to control child timers
            const friendlyTimerRef = useRef(null);
            const hostileTimerRef = useRef(null);
            
            useEffect(() => {
                setSynth(new Tone.Synth().toDestination());
            }, []);
            
            // --- Version / Update Checker & Messaging Listener ---
            useEffect(() => {
                // 1. Initial Check: Update the stored version every time to avoid the update banner showing on fresh load.
                localStorage.setItem(LOCAL_STORAGE_VERSION_KEY, CURRENT_APP_VERSION);

                // 2. Initial Check for Service Worker Pending Update (From previous session)
                if (localStorage.getItem(SERVICE_WORKER_UPDATE_KEY) === 'true') {
                    setIsUpdateReady(true);
                }

                // 3. LISTEN FOR LIVE SERVICE WORKER MESSAGES
                if ('serviceWorker' in navigator) {
                    const messageListener = (event) => {
                        // Check for the custom message from the newly installed SW
                        if (event.data && event.data.type === 'UPDATE_READY') {
                            console.log("App received UPDATE_READY message from SW. Showing banner now.");
                            // Set the flag in storage (for persistence on next load) and state (for immediate display)
                            localStorage.setItem(SERVICE_WORKER_UPDATE_KEY, 'true');
                            setIsUpdateReady(true);
                        }
                    };
                    
                    navigator.serviceWorker.addEventListener('message', messageListener);
                    
                    return () => {
                        // Cleanup the listener when the component unmounts
                        navigator.serviceWorker.removeEventListener('message', messageListener);
                    };
                }

            }, []); // Empty dependency array means this runs once on mount

            const handleUpdateReload = () => {
                // Clear the flag and force a hard reload, bypassing the cache
                localStorage.removeItem(SERVICE_WORKER_UPDATE_KEY);
                window.location.reload(true); 
            };


            // --- Wake Lock Management ---

            const releaseWakeLock = useCallback(async () => {
                if (wakeLockRef.current) {
                    await wakeLockRef.current.release().catch(e => console.error("Error releasing lock:", e));
                    wakeLockRef.current = null;
                    setLockStatus(false);
                    console.log('Screen Wake Lock explicitly released.');
                }
            }, []);

            const requestWakeLock = useCallback(async (timerId) => {
                if ('wakeLock' in navigator) {
                    if (wakeLockRef.current) {
                        // Lock is already held, do nothing
                        return;
                    }
                    try {
                        const lock = await navigator.wakeLock.request('screen');
                        
                        wakeLockRef.current = lock;
                        setLockStatus(true);
                        console.log('Screen Wake Lock successfully acquired.');

                        lock.addEventListener('release', () => {
                            setLockStatus(false);
                            console.log('Screen Wake Lock released by OS/minimization.');
                            wakeLockRef.current = null;
                        });
                    } catch (err) {
                        setLockStatus(false);
                        console.error(`Wake Lock Request Failed: ${err.name}, ${err.message}`);
                    }
                } else {
                    setLockStatus(false);
                }
            }, []);
            
            // Check if any timers are still running before releasing the lock
            const checkAndReleaseLock = useCallback(() => {
                const friendlyActive = friendlyTimerRef.current && friendlyTimerRef.current.isStarted;
                const hostileActive = hostileTimerRef.current && hostileTimerRef.current.isStarted;
                
                if (!friendlyActive && !hostileActive && wakeLockRef.current) {
                    releaseWakeLock();
                }
            }, [releaseWakeLock]);

            // Function to handle re-acquiring the lock if the user returns to the app
            const handleVisibilityChange = useCallback(() => {
                // Check if any timer is logically running
                const friendlyActive = friendlyTimerRef.current && friendlyTimerRef.current.isStarted;
                const hostileActive = hostileTimerRef.current && hostileTimerRef.current.isStarted;
                const anyTimerActive = friendlyActive || hostileActive;

                if (document.visibilityState === 'visible' && anyTimerActive && !wakeLockRef.current && ('wakeLock' in navigator)) {
                    requestWakeLock('reacquire_on_focus'); 
                }
            }, [requestWakeLock]);

            // Global useEffect for managing the visibility listener and initial cleanup
            useEffect(() => {
                document.addEventListener('visibilitychange', handleVisibilityChange);
                
                // Final cleanup on unmount
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    releaseWakeLock(); // Release lock when component unmounts
                };
            }, [handleVisibilityChange, releaseWakeLock]);
            
            // --- Global Reset Function ---
            const handleGlobalReset = () => {
                // Call the exposed 'stop' function on each timer, which resets the time and sets isStarted=false
                if (friendlyTimerRef.current) friendlyTimerRef.current.stop(); 
                if (hostileTimerRef.current) hostileTimerRef.current.stop(); 
                releaseWakeLock();
            };


            return (
                <div className="min-h-screen bg-gray-900 bg-[url('https://placehold.co/1920x1080/0d1117/2d3748/png?text=TACTICAL+OVERLAY')] bg-cover bg-center p-4 flex flex-col items-center overflow-y-auto">
                    
                    <h1 className="text-2xl sm:text-4xl font-extrabold text-white text-center mb-6 tracking-widest bg-black/50 p-2 rounded-lg border-b-4 border-red-600/70 shadow-lg font-mono">
                        TACTICAL COOLDOWN TRACKER
                    </h1>
                    
                    {/* UPDATE BANNER (Triggered only by Service Worker waiting) */}
                    {isUpdateReady && (
                        <div className="w-full max-w-5xl bg-yellow-900/40 border-2 border-yellow-500 p-3 mb-6 rounded-lg text-sm text-yellow-300 font-mono text-center animate-pulse">
                            <p className="font-bold mb-2">CRITICAL UPDATE DETECTED!</p>
                            <p className="mb-3">
                                Version {CURRENT_APP_VERSION} has been downloaded and is ready to install.
                            </p>
                            <button 
                                onClick={handleUpdateReload}
                                className="mt-1 p-2 w-full bg-yellow-600 text-gray-900 font-black rounded transition hover:bg-yellow-500 active:scale-95"
                            >
                                RELOAD AND INSTALL UPDATE
                            </button>
                        </div>
                    )}


                    {/* Main Grid */}
                    <div className="w-full max-w-5xl grid grid-cols-2 gap-4 items-stretch flex-grow"> 
                        <TacticalTimerModule 
                            ref={friendlyTimerRef}
                            name="FRIENDLY GUNSHIP" 
                            description="Allied Redeployment"
                            initialSeconds={80} 
                            colorClass="bg-green-500" 
                            synth={synth}
                            activateLock={requestWakeLock}
                            stopLock={checkAndReleaseLock}
                            timerId="friendly"
                        />

                        <TacticalTimerModule 
                            ref={hostileTimerRef}
                            name="HOSTILE GUNSHIP" 
                            description="Enemy Redeployment"
                            initialSeconds={80} 
                            colorClass="bg-red-500" 
                            synth={synth}
                            activateLock={requestWakeLock}
                            stopLock={checkAndReleaseLock}
                            timerId="hostile"
                        />
                    </div>
                    
                    {/* Global Reset Button */}
                    <button 
                        onClick={handleGlobalReset}
                        className="mt-6 w-full max-w-5xl p-3 text-sm font-black rounded-lg text-white shadow-xl uppercase tracking-wider transition transform active:scale-[0.98] border-b-4 bg-gray-700 hover:bg-gray-600 border-gray-500 font-mono"
                    >
                        RESET ALL & STANDBY (Releases Screen Lock)
                    </button>

                    <p className="mt-6 text-[10px] text-gray-500 text-center bg-black/50 p-2 rounded">
                        Cycles are 80s. Click a button to start the timer and request the Wake Lock.
                    </p>
                    
                    {/* Wake Lock Status Indicator (Simple Text Line) */}
                    <div className="mt-4 flex flex-col sm:flex-row gap-2 w-full max-w-sm justify-center mb-2">
                        <p className="text-xs font-semibold text-center rounded p-1" style={{color: lockStatus ? '#48bb78' : '#e53e3e'}}>
                            Screen Wake Lock Status: {lockStatus ? 'ACTIVE (Screen Should Stay On)' : 'INACTIVE (Blocked/Released)'}
                        </p>
                    </div>

                    {/* Advice Message (Conditional Red Box) */}
                    {!lockStatus && ('wakeLock' in navigator) && (
                        <div className="w-full max-w-sm bg-red-900/30 border border-red-700/50 p-3 rounded-lg text-xs text-red-300 font-mono text-center mb-4">
                            If the lock remains INACTIVE, your device/browser may require explicit permission in settings, or the PWA privileges are insufficient.
                        </div>
                    )}

                    {/* Version Display - Now at the VERY BOTTOM */}
                    <p className="text-[9px] text-gray-600 font-mono mt-auto pb-4">App Version: {CURRENT_APP_VERSION}</p>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <!-- Dedicated script for PWA Service Worker Registration and Update Logic -->
    <script>
        (function() {
            // Self-registering Service Worker (minimal code to handle caching)
            const SW_FILENAME = 'sw.js'; 
            // UPDATED: Cache key bumped to 2.1
            const CACHE_NAME = 'tactical-tracker-v2.1'; 
            const urlsToCache = [
                    '/', 
                ];

            // --- Service Worker Content (New logic for SKIP_WAITING) ---
            const swContent = `
                const CACHE_NAME = '${CACHE_NAME}';
                const urlsToCache = [
                    '/', 
                ];

                self.addEventListener('install', event => {
                    console.log('SW: Installing and caching assets...');
                    // Aggressively skip waiting during install
                    self.skipWaiting();
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => cache.addAll(urlsToCache))
                    );
                });

                self.addEventListener('activate', event => {
                    console.log('SW: Activating. Clearing old caches and claiming clients.');
                    event.waitUntil(
                        caches.keys().then(cacheNames => {
                            return Promise.all(
                                cacheNames.filter(cacheName => cacheName !== CACHE_NAME)
                                           .map(cacheName => caches.delete(cacheName))
                            );
                        }).then(() => self.clients.claim())
                    );
                });
                
                // NEW: Listen for messages from the client to immediately activate (SKIP_WAITING)
                self.addEventListener('message', event => {
                    if (event.data && event.data.type === 'SKIP_WAITING') {
                        console.log('SW: Received SKIP_WAITING command. Forcing activation.');
                        self.skipWaiting();
                    }
                });

                self.addEventListener('fetch', event => {
                    // Strategy: Cache-first (for offline capability)
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => {
                                // Cache hit - return response
                                if (response) return response;
                                
                                // No cache hit - fetch from network
                                return fetch(event.request);
                            })
                    );
                });
            `;
            
            // Listener for the new worker's state change to 'installed'
            const registerAndListen = async () => {
                if (!('serviceWorker' in navigator)) {
                    console.log('Service Worker not supported in this browser.');
                    return;
                }
                
                const swBlob = new Blob([swContent], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                
                try {
                    const reg = await navigator.serviceWorker.register(swUrl, { scope: '/' });
                    console.log('SW registration successful with scope:', reg.scope);
                    
                    // CRITICAL: Aggressive update polling interval (5s)
                    const pollInterval = setInterval(() => {
                        // Forcing the browser to check for the new service worker file
                        if (!reg.waiting && !reg.installing) {
                             console.log("SW Poll: Forcing update check via reg.update()");
                             reg.update();
                        } else if (reg.waiting || reg.installing) {
                            // If an update is in progress, stop polling. The listener handles the rest.
                            clearInterval(pollInterval);
                        }
                    }, 5000); 

                    // Check if a new worker is currently installing or waiting
                    if (reg.installing || reg.waiting) {
                        console.log("SW: New worker already in progress. Attaching listener.");
                        handleNewWorker(reg.installing || reg.waiting);
                    } else {
                        // Listen for the next update
                        reg.addEventListener('updatefound', () => {
                            console.log("SW: Update found listener triggered. Attaching listener to installing worker.");
                            handleNewWorker(reg.installing);
                        });
                    }
                } catch (error) {
                    console.error('SW registration failed:', error);
                }
            };
            
            const handleNewWorker = (newWorker) => {
                if (!newWorker) return;
                
                // This listener ensures we only act when the new worker is fully ready (installed/waiting)
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed') {
                        console.log('SW: Update downloaded and ready (state: installed). Triggering client update.');
                        
                        // 1. Send the message to the main app to show the banner
                        navigator.serviceWorker.ready.then(reg => {
                            if (reg.waiting) {
                                reg.waiting.postMessage({ type: 'UPDATE_READY' });
                            }
                        });
                        
                        // 2. NEW AGGRESSIVE STEP: Tell the waiting worker to skip the wait and activate immediately.
                        // This ensures the page is controlled by the NEW worker as soon as the user hits reload.
                        if (newWorker.state === 'installed' && newWorker.postMessage) {
                            console.log('SW: Sending SKIP_WAITING to new worker.');
                            newWorker.postMessage({ type: 'SKIP_WAITING' });
                        }
                    }
                });
            };

            // Start the registration and listener process
            registerAndListen();
        })();
    </script>

</body>
</html>
