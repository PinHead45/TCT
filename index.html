<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Cooldown Tracker</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tone.js (for sound notification only) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlRhY3RpY2FsIENvb2xkb3ducyIsCiAgInNob3J0X25hbWUiOiAiQ2hvcHBlclRpbWVyIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMxMTE4MjciLAogICJ0aGVtZV9jb2xvciI6IiMxMTE4MjciLAogICJpY29ucyI6IFsgeyAic3JjIjogImh0dHBzOi8vcGxhY2Vob2xkLmNvLzE5MngxOTIvMGQxMTE3L2U1M2UzZS9wbmc/dGV4dD1UQ1QiLCAic2l6ZXMiOiAiMTkyeDE5MiIsICJ0eXBlIjogImltYWdlL3BuZyIgfSBdCn0=" />

    <style>
        /* Prevent pull-to-refresh on mobile to feel more like an app */
        body {
            overscroll-behavior-y: contain;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">

    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        /**
         * Component: ProgressBar
         */
        const ProgressBar = ({ timeLeft, initialSeconds, primaryColor, isStarted }) => {
            const percentage = (timeLeft / initialSeconds) * 100;

            let barColor = primaryColor;
            
            if (percentage <= 15 && isStarted) {
                barColor = 'bg-red-700 animate-pulse'; 
            } else if (percentage <= 40 && isStarted) {
                barColor = 'bg-yellow-500';
            } else if (!isStarted) {
                barColor = 'bg-gray-600';
            }

            return (
                <div className="w-full h-10 bg-gray-900 border-2 border-dashed border-gray-600 rounded-lg overflow-hidden relative shadow-inner">
                    <div 
                        className={`h-full ${barColor} transition-all duration-100 ease-linear flex items-center justify-center`}
                        style={{ width: `${percentage}%` }}
                    >
                    </div>
                </div>
            );
        };

        // --- Custom Hook: useTimer ---
        const useTimer = (initialSeconds, synth, onCompletion) => {
            const [timeLeft, setTimeLeft] = useState(initialSeconds);
            const [isStarted, setIsStarted] = useState(false);
            const intervalRef = useRef(null);

            const handleTimerCompletion = useCallback(() => {
                // Ensure audio context is running before playing sound
                if (synth && typeof Tone !== 'undefined' && Tone.context.state !== 'running') {
                    Tone.start();
                }
                synth?.triggerAttackRelease('D5', '8n'); 
                setTimeLeft(initialSeconds); 
                onCompletion(); // Notify parent of completion
            }, [initialSeconds, synth, onCompletion]);

            const triggerStartOrRestart = useCallback(() => {
                if (!isStarted) {
                    setIsStarted(true);
                } else {
                    setTimeLeft(initialSeconds);
                }
            }, [isStarted]);

            const stopTimer = useCallback(() => {
                setIsStarted(false);
            }, []);

            useEffect(() => {
                if (isStarted) {
                    if (intervalRef.current) clearInterval(intervalRef.current);
                    intervalRef.current = setInterval(() => {
                        setTimeLeft(prevTime => {
                            if (prevTime > 1) return prevTime - 1;
                            else if (prevTime === 1) {
                                handleTimerCompletion();
                                return 0; 
                            }
                            if (prevTime === 0) return initialSeconds;
                            return prevTime;
                        });
                    }, 1000);
                } else {
                    if (intervalRef.current) {
                        clearInterval(intervalRef.current);
                        intervalRef.current = null;
                    }
                }
                return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
            }, [isStarted, initialSeconds, handleTimerCompletion]);
            
            return { timeLeft, isStarted, triggerStartOrRestart, stopTimer };
        };


        /**
         * Component: TacticalTimerModule
         */
        const TacticalTimerModule = ({ name, description, initialSeconds, colorClass, synth, activateLock, releaseLock, timerId }) => {
            const handleCompletion = useCallback(() => {
                // Timer automatically loops, no need to release lock here unless timer is explicitly stopped
            }, []);

            const { timeLeft, isStarted, triggerStartOrRestart, stopTimer } = useTimer(initialSeconds, synth, handleCompletion);
            
            const handleButtonClick = () => {
                triggerStartOrRestart();
                activateLock(timerId); // Request wake lock
            };
            
            // Effect to manage wake lock acquisition and release based on timer state
            useEffect(() => {
                // If the timer is manually stopped (not implemented yet, but good practice), release the lock.
                // For now, the lock stays active while running, and is managed globally by the App component.
            }, [isStarted]);


            const buttonText = isStarted ? 'INSTANT RECALL & REDEPLOY' : 'INITIATE DEPLOYMENT CYCLE';
            const buttonColor = colorClass.replace('bg-', 'bg-');
            const borderColor = colorClass.replace('bg-', 'border-');

            let statusText = isStarted ? 'ACTIVE COOLDOWN / ON LOOP' : 'STATUS: STANDBY';
            let statusColor = 'text-gray-500';
            
            if (isStarted && timeLeft <= 10) {
                statusText = 'INBOUND! LANDING ZONE CLEARANCE';
                statusColor = colorClass.replace('bg-', 'text-');
                if (colorClass === 'bg-red-500') statusColor = 'text-red-500 animate-pulse';
            } else if (isStarted && timeLeft === initialSeconds) {
                statusText = 'REDEPLOYING CHOPPER...';
                statusColor = 'text-white animate-pulse';
            } else if (isStarted) {
                statusColor = colorClass.replace('bg-', 'text-');
            }

            return (
                <div className="flex flex-col bg-gray-900/90 p-4 sm:p-6 rounded-lg shadow-2xl w-full h-full border-2 border-dashed border-gray-600/50 font-mono">
                    <div className="flex flex-col w-full flex-grow items-center">
                        <h2 className={`text-xl font-bold uppercase tracking-widest mb-2 text-center ${colorClass.replace('bg-', 'text-')}`}>
                            {name}
                        </h2>
                        <p className="text-xs text-gray-400 mb-4 text-center">{description}</p>
                        <p className={`text-[10px] font-semibold mb-4 ${statusColor}`}>{statusText}</p>

                        <div className="mt-auto mb-6 w-full"> 
                            <ProgressBar 
                                timeLeft={timeLeft} 
                                initialSeconds={initialSeconds} 
                                primaryColor={colorClass} 
                                isStarted={isStarted}
                            />
                        </div>
                    </div>

                    <button 
                        onClick={handleButtonClick}
                        className={`w-full p-4 text-sm font-black rounded-lg text-white shadow-xl uppercase tracking-wider transition transform active:scale-[0.98] border-b-4 ${buttonColor} ${borderColor}`}
                        style={{borderColor: colorClass.replace('bg-', '')}}
                    >
                        {buttonText}
                    </button>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [synth, setSynth] = useState(null);
            // Stores the active lock object returned by the API
            const wakeLockRef = useRef(null); 
            const [lockStatus, setLockStatus] = useState(false);
            
            // Tracks if any timer is currently trying to use the lock (optional for this simple case, but good practice)
            const [activeTimers, setActiveTimers] = useState({}); 

            useEffect(() => {
                setSynth(new Tone.Synth().toDestination());
            }, []);
            
            // --- Wake Lock Management ---

            const requestWakeLock = useCallback(async (timerId) => {
                if ('wakeLock' in navigator) {
                    try {
                        // Request a screen wake lock
                        const lock = await navigator.wakeLock.request('screen');
                        
                        // Store the lock object and update status
                        wakeLockRef.current = lock;
                        setLockStatus(true);
                        console.log('Screen Wake Lock successfully acquired.');

                        // Listen for lock release by the OS (e.g., if the user minimizes the app)
                        lock.addEventListener('release', () => {
                            setLockStatus(false);
                            console.log('Screen Wake Lock released.');
                            wakeLockRef.current = null;
                        });
                    } catch (err) {
                        setLockStatus(false);
                        console.error(`Wake Lock Request Failed: ${err.name}, ${err.message}`);
                    }
                } else {
                    console.warn("Wake Lock API not supported in this browser/PWA environment.");
                    setLockStatus(false);
                }
            }, []);
            
            // Function to handle re-acquiring the lock if the user returns to the app
            const handleVisibilityChange = useCallback(() => {
                // If the app is visible and the lock was previously held, request it again
                if (document.visibilityState === 'visible' && !wakeLockRef.current && ('wakeLock' in navigator)) {
                    // Check if at least one timer is active (not strictly needed for this app, but safe)
                    requestWakeLock('reacquire'); 
                }
            }, [requestWakeLock]);

            // Global useEffect for managing the visibility listener
            useEffect(() => {
                document.addEventListener('visibilitychange', handleVisibilityChange);
                // Clean up listener on unmount
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLockRef.current) {
                        wakeLockRef.current.release().catch(e => console.error("Error releasing lock on unmount", e));
                    }
                };
            }, [handleVisibilityChange]);
            
            // Lock release is managed automatically by the browser when the tab is backgrounded, 
            // and we re-acquire it on visibility change. 
            // We only explicitly request it on the user gesture (button click).

            return (
                <div className="min-h-screen bg-gray-900 bg-[url('https://placehold.co/1920x1080/0d1117/2d3748/png?text=TACTICAL+OVERLAY')] bg-cover bg-center p-4 flex flex-col items-center overflow-y-auto">
                    
                    <h1 className="text-2xl sm:text-4xl font-extrabold text-white text-center mb-6 tracking-widest bg-black/50 p-2 rounded-lg border-b-4 border-red-600/70 shadow-lg font-mono">
                        TACTICAL COOLDOWN TRACKER
                    </h1>

                    {/* Main Grid */}
                    <div className="w-full max-w-5xl grid grid-cols-2 gap-4 items-stretch flex-grow"> 
                        <TacticalTimerModule 
                            name="FRIENDLY GUNSHIP" 
                            description="Allied Redeployment"
                            initialSeconds={80} 
                            colorClass="bg-green-500" 
                            synth={synth}
                            activateLock={requestWakeLock}
                            timerId="friendly"
                        />

                        <TacticalTimerModule 
                            name="HOSTILE GUNSHIP" 
                            description="Enemy Redeployment"
                            initialSeconds={80} 
                            colorClass="bg-red-500" 
                            synth={synth}
                            activateLock={requestWakeLock}
                            timerId="hostile"
                        />
                    </div>

                    <p className="mt-6 text-[10px] text-gray-500 text-center bg-black/50 p-2 rounded">
                        Cycles are 80s. Click a button to start the timer and request the Wake Lock.
                    </p>
                    
                    {/* Wake Lock Status Indicator */}
                    <div className="mt-4 flex flex-col sm:flex-row gap-2 w-full max-w-sm justify-center mb-8">
                        <p className="text-xs font-semibold text-center rounded p-1" style={{color: lockStatus ? '#48bb78' : '#e53e3e'}}>
                            Screen Wake Lock Status: {lockStatus ? 'ACTIVE (Screen Should Stay On)' : 'INACTIVE (Blocked/Released)'}
                        </p>
                    </div>
                    
                    {/* Advice Message */}
                    {!lockStatus && ('wakeLock' in navigator) && (
                        <div className="w-full max-w-sm bg-red-900/30 border border-red-700/50 p-3 rounded-lg text-xs text-red-300 font-mono text-center mt-2">
                            If the lock remains INACTIVE, your device/browser may require explicit permission in settings, or the PWA privileges are insufficient.
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
